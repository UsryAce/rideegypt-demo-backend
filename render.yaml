# Render.com Blueprint — one-click deploy for the Rahal Go backend.
# In Render: New + → Blueprint → connect this repo.
services:
  - type: web
    name: rahalgo-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong secret automatically
      - key: DEV_MODE
        value: "true"          # keep OTP auto-fill (no SMS bill). Set "false" after adding Twilio.
